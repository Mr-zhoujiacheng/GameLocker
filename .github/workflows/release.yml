name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        default: v3.4.4
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate Appx build tools
        id: appx
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -property installationPath
          if (-not $installation) { throw 'Visual Studio Build Tools were not found.' }
          $appxPath = Join-Path $installation 'MSBuild\Microsoft\VisualStudio\v17.0\AppxPackage'
          $task = Join-Path $appxPath 'Microsoft.Build.AppxPackage.dll'
          if (-not (Test-Path $task)) {
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            & $setup modify --installPath $installation --add Microsoft.VisualStudio.ComponentGroup.UWP.BuildTools --passive --norestart
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $task)) { throw "Appx build tools were not installed at $appxPath" }
          "APX_PATH=$appxPath\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify tag and project versions
        shell: pwsh
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          [xml]$project = Get-Content GameLocker.csproj
          $projectVersion = $project.Project.PropertyGroup.Version
          $installerVersion = (Select-String -Path GameLocker.iss -Pattern '^#define AppVersion "([^"]+)"').Matches.Groups[1].Value
          if ($tagVersion -ne $projectVersion -or $tagVersion -ne $installerVersion) {
            throw "Tag ($tagVersion), project ($projectVersion), and installer ($installerVersion) versions must match."
          }

      - name: Restore and build
        shell: pwsh
        run: dotnet build GameLocker.csproj -c Release -p:AppxMSBuildToolsPath="$env:APX_PATH"

      - name: Run tests
        shell: pwsh
        run: |
          dotnet run --project tests/SaveRestore.Tests/SaveRestore.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tests\ProxyLifecycle.Tests\Test-ProxyLifecycleSource.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tests\Test-SystemLifecycleSource.ps1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc GameLocker.iss "/O$env:GITHUB_WORKSPACE\dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $assetPath = Join-Path $env:GITHUB_WORKSPACE "dist\GameLocker-Setup-$tag.exe"
          if (-not (Test-Path -LiteralPath $assetPath)) {
            throw "Installer not found: $assetPath"
          }

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"

          function Invoke-GitHubJson {
            param([ValidateSet('GET', 'POST', 'DELETE')][string] $Method, [string] $Uri, [object] $Body)
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                if ($null -eq $Body) {
                  return Invoke-RestMethod -Method $Method -Uri $Uri -Headers $headers
                }
                $json = $Body | ConvertTo-Json -Depth 5
                return Invoke-RestMethod -Method $Method -Uri $Uri -Headers $headers -ContentType 'application/json' -Body $json
              } catch {
                if ($attempt -eq 5) { throw }
                Start-Sleep -Seconds ([Math]::Min(30, 2 * $attempt))
              }
            }
          }

          try {
            $release = Invoke-GitHubJson GET "$api/releases/tags/$tag" $null
          } catch {
            $release = Invoke-GitHubJson POST "$api/releases" @{
              tag_name = $tag
              name = "Game Locker $tag"
              generate_release_notes = $true
              draft = $false
              prerelease = $false
            }
          }

          $assetName = [IO.Path]::GetFileName($assetPath)
          $existing = @($release.assets | Where-Object { $_.name -eq $assetName })
          foreach ($asset in $existing) {
            Invoke-GitHubJson DELETE "$api/releases/assets/$($asset.id)" $null | Out-Null
          }

          $uploadUri = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?name=$([Uri]::EscapeDataString($assetName))"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Method Post -Uri $uploadUri -Headers $headers -ContentType 'application/octet-stream' -InFile $assetPath | Out-Null
              break
            } catch {
              $assets = Invoke-GitHubJson GET "$api/releases/$($release.id)/assets" $null
              if (@($assets | Where-Object { $_.name -eq $assetName }).Count -gt 0) { break }
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds ([Math]::Min(30, 2 * $attempt))
            }
          }
          $publishedAssets = Invoke-GitHubJson GET "$api/releases/$($release.id)/assets" $null
          if (@($publishedAssets | Where-Object { $_.name -eq $assetName }).Count -eq 0) {
            throw "GitHub Release asset upload did not complete: $assetName"
          }
          Write-Host "Published $assetName to $($release.html_url)"
