name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate Appx build tools
        id: appx
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -property installationPath
          if (-not $installation) { throw 'Visual Studio Build Tools were not found.' }
          $appxPath = Join-Path $installation 'MSBuild\Microsoft\VisualStudio\v17.0\AppxPackage'
          $task = Join-Path $appxPath 'Microsoft.Build.AppxPackage.dll'
          if (-not (Test-Path $task)) {
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            & $setup modify --installPath $installation --add Microsoft.VisualStudio.ComponentGroup.UWP.BuildTools --passive --norestart
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $task)) { throw "Appx build tools were not installed at $appxPath" }
          "APX_PATH=$appxPath\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify tag and project versions
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          [xml]$project = Get-Content GameLocker.csproj
          $projectVersion = $project.Project.PropertyGroup.Version
          $installerVersion = (Select-String -Path GameLocker.iss -Pattern '^#define AppVersion "([^"]+)"').Matches.Groups[1].Value
          if ($tagVersion -ne $projectVersion -or $tagVersion -ne $installerVersion) {
            throw "Tag ($tagVersion), project ($projectVersion), and installer ($installerVersion) versions must match."
          }

      - name: Restore and build
        shell: pwsh
        run: dotnet build GameLocker.csproj -c Release -p:AppxMSBuildToolsPath="$env:APX_PATH"

      - name: Run tests
        shell: pwsh
        run: |
          dotnet run --project tests/SaveRestore.Tests/SaveRestore.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tests\ProxyLifecycle.Tests\Test-ProxyLifecycleSource.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tests\Test-SystemLifecycleSource.ps1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc GameLocker.iss "/O$env:GITHUB_WORKSPACE\dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Game Locker ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/GameLocker-Setup-${{ github.ref_name }}.exe
